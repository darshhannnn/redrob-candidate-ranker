ai_tools_used:
  - "Gemini"
  - "Claude"

ai_usage_summary: |
  Used Gemini for code generation, strategy formulation, and documentation. 
  Used Claude for architectural review of the scoring logic.
  No candidate data was shared with external APIs during the ranking process.

methodology_summary: |
  Signal-weighted heuristic ranker using 7-dimensional scoring (Experience, 
  Weighted Keywords, Production Context, Product/Service Filtering, Title Guard, 
  Location, and Behavioral Signals). Includes an explicit Integrity Layer 
  to detect and filter synthetic "honeypot" profiles with impossible 
  education or skill timelines. Highly efficient CPU-only implementation 
  processing 100k candidates in <30 seconds.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
