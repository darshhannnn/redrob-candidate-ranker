ai_tools_used:
  - "Gemini"
  - "Claude"

ai_usage_summary: |
  Used Gemini for code generation, strategy formulation, and documentation. 
  Used Claude for architectural review of the scoring logic.
  No candidate data was shared with external APIs during the ranking process.

methodology_summary: |
  Two-stage Hybrid Pipeline: Stage 1 performs fast vector retrieval using 
  all-mpnet-base-v2 and ChromaDB to shortlist 80 candidates. Stage 2 
  applies signal-weighted feature scoring (Experience, Production context, 
  Behavioral). Stage 3 performs deep reranking of the top 20 candidates 
  using a local LLM (Ollama) to generate explainable reasoning and fit 
  scores. Includes a strict Integrity Guard (Stage 0) that disqualifies 
  honeypots and non-technical title stuffers.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
